name: Quick checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quick-checks:
    name: Static analysis and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck gddrescue jq sleuthkit gawk python3
      - name: Check shell scripts and project rules
        run: tests/lint.sh
      - name: Test with mawk
        run: |
          sudo update-alternatives --set awk /usr/bin/mawk
          tests=()
          for test in tests/unit/test_*.sh; do
            case ${test##*/} in
              test_service.sh | test_triage.sh) continue ;; # timing and asynchronous callbacks
            esac
            tests+=("${test##*/}")
          done
          tests/unit/run.sh "${tests[@]}"
      - name: Test with gawk
        run: |
          sudo update-alternatives --set awk /usr/bin/gawk
          tests=()
          for test in tests/unit/test_*.sh; do
            case ${test##*/} in
              test_service.sh | test_triage.sh) continue ;; # timing and asynchronous callbacks
            esac
            tests+=("${test##*/}")
          done
          tests/unit/run.sh "${tests[@]}"
